    <text x="18" y="32" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">XE CON (A)</text>
    <path d="M18 -5 L18 -40 Q18 -60 70 -60 L60 -68 M70 -60 L60 -52" stroke="#10B981" stroke-width="4" stroke-linecap="round" fill="none"/>
