  <text x="250" y="380" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Quy tắc hướng đi: Xe Rẽ Phải (A) > Xe Đi Thẳng (B) > Xe Rẽ Trái (C)</text>
