  <line x1="250" y1="0" x2="250" y2="400" stroke="#FBBF24" stroke-width="4" stroke-dasharray="12,12" />
  <line x1="0" y1="200" x2="500" y2="200" stroke="#FBBF24" stroke-width="4" stroke-dasharray="12,12" />

  <g transform="translate(265, 300)">
