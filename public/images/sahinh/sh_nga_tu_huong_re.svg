    <text x="35" y="21" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">XE TẢI (B)</text>
    <path d="M-10 17 L-80 17 L-70 10 M-80 17 L-70 24" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" fill="none"/>
