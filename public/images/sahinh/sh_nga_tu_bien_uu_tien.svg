<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <rect width="500" height="400" fill="#15803D" />
  <rect x="180" y="0" width="140" height="400" fill="#334155" />
  <rect x="0" y="130" width="500" height="140" fill="#334155" />
  
  <line x1="250" y1="0" x2="250" y2="130" stroke="#FBBF24" stroke-width="4" stroke-dasharray="12,12" />
  <line x1="250" y1="270" x2="250" y2="400" stroke="#FBBF24" stroke-width="4" stroke-dasharray="12,12" />
  <line x1="0" y1="200" x2="180" y2="200" stroke="#FBBF24" stroke-width="4" stroke-dasharray="12,12" />
  <line x1="320" y1="200" x2="500" y2="200" stroke="#FBBF24" stroke-width="4" stroke-dasharray="12,12" />

  <g transform="translate(330, 280) scale(0.6)">
    <rect x="18" y="40" width="4" height="45" fill="#94A3B8"/>
    <polygon points="20,0 40,20 20,40 0,20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <polygon points="20,5 35,20 20,35 5,20" fill="#FBBF24"/>
  </g>

  <g transform="translate(330, 90) scale(0.6)">
    <rect x="18" y="35" width="4" height="45" fill="#94A3B8"/>
    <polygon points="20,35 0,0 40,0" fill="#FBBF24" stroke="#DC2626" stroke-width="4"/>
  </g>

  <g transform="translate(265, 300)">
    <rect x="0" y="0" width="36" height="60" rx="8" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="4" y="14" width="28" height="22" rx="4" fill="#1E293B"/>
    <text x="18" y="52" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">XE CON</text>
    <path d="M18 -10 L18 -80 L10 -70 M18 -80 L26 -70" stroke="#10B981" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <g transform="translate(380, 150)">
    <rect x="0" y="0" width="70" height="36" rx="4" fill="#E11D48" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="0" y="4" width="22" height="28" rx="2" fill="#BE123C"/>
    <text x="45" y="22" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">XE TẢI</text>
    <path d="M-10 18 Q-80 18 -80 -60 L-88 -50 M-80 -60 L-72 -50" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <g transform="translate(205, 40)">
    <rect x="0" y="0" width="20" height="40" rx="6" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="10" y="24" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">MÔ TÔ</text>
    <path d="M10 50 L10 100 Q10 130 -50 130 L-40 122 M-50 130 L-40 138" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <rect x="70" y="360" width="360" height="30" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="250" y="380" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">Xe Con (trên đường ưu tiên) & Xe Mô Tô được đi trước Xe Tải</text>
