<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <rect width="500" height="400" fill="#15803D" />
  <rect x="180" y="0" width="140" height="400" fill="#334155" />
  <rect x="0" y="130" width="500" height="140" fill="#334155" />
  
  <line x1="250" y1="0" x2="250" y2="130" stroke="#FBBF24" stroke-width="4" stroke-dasharray="12,12" />
  <line x1="250" y1="270" x2="250" y2="400" stroke="#FBBF24" stroke-width="4" stroke-dasharray="12,12" />
  <line x1="0" y1="200" x2="180" y2="200" stroke="#FBBF24" stroke-width="4" stroke-dasharray="12,12" />
  <line x1="320" y1="200" x2="500" y2="200" stroke="#FBBF24" stroke-width="4" stroke-dasharray="12,12" />

  <g transform="translate(265, 310)">
    <rect x="0" y="0" width="22" height="48" rx="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    <text x="11" y="28" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">MÔ TÔ</text>
    <path d="M11 -10 L11 -60 L4 -50 M11 -60 L18 -50" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>
  <g transform="translate(60, 210)">
    <rect x="0" y="0" width="90" height="35" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="45" y="22" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#10B981" text-anchor="middle">PHÍA PHẢI TRỐNG</text>
  </g>

  <g transform="translate(380, 150)">
    <rect x="0" y="0" width="65" height="34" rx="6" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
    <text x="32" y="21" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">XE CON</text>
    <path d="M-10 17 L-60 17 L-50 10 M-60 17 L-50 24" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <g transform="translate(200, 30)">
    <rect x="0" y="0" width="38" height="70" rx="4" fill="#E11D48" stroke="#FFFFFF" stroke-width="2"/>
    <text x="19" y="38" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">XE TẢI</text>
    <path d="M19 80 L19 130 L12 120 M19 130 L26 120" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <rect x="60" y="360" width="380" height="30" rx="8" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="250" y="380" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Thứ tự đi: Xe Mô tô (bên phải trống) -> Xe Con -> Xe Tải</text>
