    <!-- Theme Initializer: Default to clean Light Theme (Nền Sáng) unless user chose Dark -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('thayhong_theme');
          var activeTheme = (saved === 'dark') ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', activeTheme);
          var metaTheme = document.getElementById('meta-theme-color');
          if (metaTheme) {
            metaTheme.setAttribute('content', activeTheme === 'dark' ? '#0B1120' : '#FFFFFF');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
