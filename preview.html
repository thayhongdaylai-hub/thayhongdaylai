  <style>
    /* ==========================================================================
       DESIGN SYSTEM & THEME TOKENS (LIGHT & DARK MODE)
       ========================================================================== */
    :root, [data-theme='dark'] {
      --bg-main: #0B0F19;
      --bg-card: #131B2E;
      --bg-card-hover: #1A243F;
      --bg-nav: rgba(11, 15, 25, 0.85);
      --bg-glass: rgba(19, 27, 46, 0.7);
      --bg-input: #19233C;

      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --text-light: #6B7280;

      --border-color: rgba(255, 255, 255, 0.1);
      --border-highlight: rgba(0, 229, 153, 0.3);

      --accent-emerald: #00E599;
      --accent-emerald-glow: rgba(0, 229, 153, 0.25);
      --accent-blue: #3B82F6;
      --accent-blue-glow: rgba(59, 130, 246, 0.25);
      --accent-orange: #F59E0B;
      --accent-red: #EF4444;

      --gradient-emerald: linear-gradient(135deg, #00E599 0%, #00B377 100%);
      --gradient-blue: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
      --gradient-orange: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      --gradient-dark-card: linear-gradient(180deg, rgba(25, 35, 60, 0.8) 0%, rgba(13, 20, 35, 0.9) 100%);
      --gradient-hero: radial-gradient(circle at 50% 20%, rgba(0, 229, 153, 0.12) 0%, rgba(59, 130, 246, 0.08) 50%, rgba(11, 15, 25, 0) 100%);

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
      --shadow-neon: 0 0 25px rgba(0, 229, 153, 0.3);
    }

    [data-theme='light'] {
      --bg-main: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F1F5F9;
      --bg-nav: rgba(255, 255, 255, 0.9);
      --bg-glass: rgba(255, 255, 255, 0.8);
      --bg-input: #F1F5F9;

      --text-main: #0F172A;
      --text-muted: #475569;
      --text-light: #94A3B8;

      --border-color: #E2E8F0;
      --border-highlight: rgba(16, 185, 129, 0.4);

      --accent-emerald: #059669;
      --accent-emerald-glow: rgba(5, 150, 105, 0.15);
      --accent-blue: #2563EB;
      --accent-blue-glow: rgba(37, 99, 235, 0.15);
      --accent-orange: #D97706;
      --accent-red: #DC2626;

      --gradient-emerald: linear-gradient(135deg, #059669 0%, #047857 100%);
      --gradient-blue: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      --gradient-orange: linear-gradient(135deg, #D97706 0%, #B45309 100%);
      --gradient-dark-card: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
      --gradient-hero: radial-gradient(circle at 50% 20%, rgba(5, 150, 105, 0.08) 0%, rgba(37, 99, 235, 0.06) 50%, rgba(248, 250, 252, 0) 100%);

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 16px 40px rgba(15, 23, 42, 0.12);
      --shadow-neon: 0 0 25px rgba(5, 150, 105, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-family: 'Be Vietnam Pro', 'Inter', sans-serif; font-size: 16px; }
    body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; overflow-x: hidden; transition: background-color 0.3s ease, color 0.3s ease; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Be Vietnam Pro', 'Montserrat', sans-serif; font-weight: 700; line-height: 1.25; color: var(--text-main); }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font-family: inherit; }
    
    .container { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 1.5rem; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.85rem 1.75rem; border-radius: 9999px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid transparent; }
    .btn-primary { background: var(--gradient-emerald); color: #051A10; font-weight: 700; box-shadow: 0 4px 14px var(--accent-emerald-glow); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-emerald-glow); filter: brightness(1.08); }
    .btn-secondary { background: var(--bg-card); color: var(--text-main); border-color: var(--border-color); }
    .btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--accent-blue); color: var(--accent-blue); transform: translateY(-2px); }

    .badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.9rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; }
    .badge-emerald { background: var(--accent-emerald-glow); color: var(--accent-emerald); border: 1px solid rgba(0, 229, 153, 0.3); }
    .badge-blue { background: var(--accent-blue-glow); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-purple {
      background: rgba(168, 85, 247, 0.18);
      color: #A855F7;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }
    .badge-orange { background: rgba(245, 158, 11, 0.15); color: var(--accent-orange); border: 1px solid rgba(245, 158, 11, 0.3); }

    .text-gradient { background: linear-gradient(135deg, var(--accent-emerald) 0%, var(--accent-blue) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .glass-card { background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 1.25rem; transition: all 0.3s ease; }
    .glass-card:hover { border-color: var(--border-highlight); box-shadow: var(--shadow-md); }

    .section-title-wrapper { text-align: center; max-width: 700px; margin: 0 auto 3.5rem auto; }
    .section-title { font-size: 2.5rem; margin-top: 0.75rem; margin-bottom: 1rem; letter-spacing: -0.02em; }
    .section-subtitle { color: var(--text-muted); font-size: 1.1rem; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }

    /* Hide scrollbars */
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    input, select, textarea {
      font-size: 16px !important;
      touch-action: manipulation;
    }

    html, body {
      overflow-x: hidden;
      width: 100%;
    }

    @media (max-width: 1024px) {
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .section-title { font-size: 2rem; }
    }
    @media (max-width: 768px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .section-title { font-size: 1.65rem; }
      .container { padding: 0 1rem; }
      body { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
    }

    .brand-logo:hover .brand-icon-box { transform: scale(1.08) rotate(-4deg); box-shadow: 0 6px 22px rgba(0, 229, 153, 0.45); }
    
    .desktop-nav-grid { display: grid; grid-template-rows: repeat(2, auto); grid-template-columns: repeat(3, auto); gap: 0.4rem 0.65rem; align-items: center; margin: 0 1rem; }
    .nav-link-card { display: inline-flex; align-items: center; justify-content: center; padding: 0.38rem 0.85rem; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-muted); font-size: 0.88rem; font-weight: 600; text-decoration: none; white-space: nowrap; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: var(--shadow-sm); }
    .nav-link-card:hover { border-color: var(--accent-emerald); background: var(--bg-card-hover); color: var(--accent-emerald); box-shadow: 0 4px 16px var(--accent-emerald-glow); transform: translateY(-2px); }

    /* ==========================================
       LEGAL MODAL & RESPONSIVE TABS
       ========================================== */
    .legal-modal-header {
      padding: 0.85rem 1.25rem;
      background: #131B2E;
      border-bottom: 1px solid #1E293B;
      display: flex;
      align-items: center;

    }

    }
    .legal-tabs-list {
      display: flex;

    }
    .legal-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.52rem 0.95rem;
      border-radius: 10px;
      border: 1px solid #1E293B;
      background: #0F172A;
      color: #94A3B8;
      font-weight: 700;
      font-size: 0.78rem;

    .tab-label-desktop {

      display: none;
    }

    @media (max-width: 768px) {
      .legal-modal-backdrop {
        align-items: center !important;
        padding: max(2.75rem, calc(env(safe-area-inset-top, 0px) + 2.25rem)) 0.65rem max(1rem, env(safe-area-inset-bottom, 0px)) 0.65rem !important;
      }
      .legal-modal-container {
        height: calc(100dvh - max(4.5rem, calc(env(safe-area-inset-top, 0px) + 3.75rem))) !important;
        max-height: calc(100dvh - max(4.5rem, calc(env(safe-area-inset-top, 0px) + 3.75rem))) !important;
        border-radius: 18px !important;
      }
      .legal-modal-header {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 0.75rem !important;
        padding: 1.15rem 0.85rem 0.85rem 0.85rem !important;
      }
      .legal-header-top-bar {
        width: 100% !important;
        justify-content: space-between !important;
        order: 1 !important;
        padding: 0.1rem 0.15rem !important;
      }
      .legal-header-brand-badge {
        display: inline-flex !important;
        align-items: center !important;
        gap: 0.4rem !important;
        font-size: 0.74rem !important;
        font-weight: 800 !important;
        color: #60A5FA !important;
        text-transform: uppercase !important;
        letter-spacing: 0.03em !important;
      }
      .legal-tabs-list {
        display: grid !important;
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 0.35rem !important;
        width: 100% !important;
        order: 2 !important;
        overflow: visible !important;
      }
      .legal-tab-btn {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 0.45rem 0.2rem !important;
        border-radius: 9px !important;
        min-height: 52px !important;
        width: 100% !important;
        white-space: normal !important;
        text-align: center !important;
      }
      .tab-label-desktop {
        display: none !important;
      }
      .tab-label-mobile {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        line-height: 1.15 !important;
      }
      .tab-mobile-main {
        font-size: 0.72rem !important;
        font-weight: 800 !important;
        color: inherit !important;
      }
      .tab-mobile-sub {
        font-size: 0.64rem !important;
        font-weight: 600 !important;
        opacity: 0.88 !important;
        color: inherit !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Mock Driving Test Data ---
    const MOCK_EXAM_QUESTIONS = [
      {
        id: 1,
        question: "Khái niệm 'Dải phân cách' được hiểu như thế nào là đúng?",
        options: [
          "A. Là bộ phận của đường để phân chia mặt đường thành hai chiều xe chạy riêng biệt hoặc để phân chia phần đường của xe cơ giới và xe thô sơ.",
          "B. Là bộ phận của đường để phân tách khu vực xe buýt và xe ô tô cá nhân.",
          "C. Là dải đất dọc theo lề đường dành riêng cho người đi bộ."
        ],
        answer: 0,
        explanation: "Dải phân cách phân chia mặt đường thành hai chiều xe chạy riêng biệt hoặc phân chia đường xe cơ giới & xe thô sơ."
      },
      {
        id: 2,
        question: "Người điều khiển xe mô tô hai bánh, xe gắn máy có được phép buông cả hai tay hoặc đi xe bằng một bánh không?",
        options: [
          "A. Được phép nếu đường vắng.",
          "B. Không được phép.",
          "C. Được phép khi biểu diễn nghệ thuật."
        ],
        answer: 1,
        explanation: "Hành vi buông cả hai tay, đi xe 1 bánh bị nghiêm cấm theo Luật Giao thông đường bộ."
      },
      {
        id: 3,
        question: "Biển nào báo hiệu 'Đường giao nhau của các tuyến đường cùng cấp'?",
        options: [
          "A. Biển hình tam giác đều đỉnh hướng lên có dấu cộng (+)",
          "B. Biển hình tròn màu xanh",
          "C. Biển hình thoi màu vàng"
        ],
        answer: 0,
        explanation: "Biển tam giác viền đỏ nền vàng có dấu cộng đen bên trong là biển báo đường cùng cấp."
      },
      {
        id: 4,
        question: "Tại nơi đường giao nhau không có đảo an toàn, người điều khiển phương tiện phải nhường đường như thế nào?",
        options: [
          "A. Nhường đường cho xe đi từ bên phải đến.",
          "B. Nhường đường cho xe đi từ bên trái đến.",
          "C. Xe nào to hơn thì được đi trước."
        ],
        answer: 0,
        explanation: "Nơi giao nhau không có vòng xoay (đảo an toàn), phải nhường đường cho xe đến từ bên phải."
      }
    ];

    // --- Navbar ---
    function Navbar({ theme, toggleTheme, onOpenRegister, onOpenTestModal }) {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const navLinks = [
        { name: 'Gói Học & Học Phí', href: '#courses' },
        { name: 'Lộ Trình Đào Tạo', href: '#roadmap' },
        { name: 'Tính Chi Phí', href: '#calculator' },
        { name: 'Sân Tập Chuẩn ISO', href: '#facilities' },
        { name: 'Đánh Giá Học Viên', href: '#testimonials' },
        { name: 'Hỏi Đáp (FAQ)', href: '#faq' },
      ];

      return (
        <header style={{ position: 'sticky', top: 0, zIndex: 100, background: 'var(--bg-nav)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', borderBottom: '1px solid var(--border-color)', transition: 'all 0.3s ease' }}>
          <div className="container" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', minHeight: '84px', paddingTop: '0.5rem', paddingBottom: '0.5rem' }}>
            <a href="#" className="brand-logo" style={{ display: 'flex', alignItems: 'center', gap: '0.85rem', textDecoration: 'none', flexShrink: 0 }}>
              <img src="/public/logo.png" alt="Logo Thầy Hồng Dạy Lái" width="46" height="46" style={{ width: '46px', height: '46px', borderRadius: '50%', border: '2px solid #FBBF24', boxShadow: '0 4px 16px rgba(0, 229, 153, 0.25)', flexShrink: 0 }} onError={(e) => { e.target.src = 'public/logo.png'; }} />
              <div style={{ fontFamily: "'Outfit', sans-serif", fontSize: '1.35rem', fontWeight: 800, letterSpacing: '-0.02em', lineHeight: 1.2, whiteSpace: 'nowrap', display: 'flex', alignItems: 'center', gap: '0.35rem' }}>
                <span style={{ color: 'var(--text-main)' }}>THẦY HỒNG</span>
                <span className="text-gradient">DẠY LÁI</span>
              </div>
            </a>

            <nav className="desktop-nav desktop-nav-grid">
              {navLinks.map((link, idx) => (
                <a key={idx} href={link.href} className="nav-link-card">{link.name}</a>
              ))}
            </nav>

            <div style={{ display: 'flex', alignItems: 'center', gap: '0.8rem' }}>
              {/* Practice Test Button */}
              <button onClick={onOpenTestModal} className="btn" style={{ background: 'var(--accent-blue-glow)', color: 'var(--accent-blue)', border: '1px solid rgba(59, 130, 246, 0.4)', padding: '0.6rem 1.1rem', fontSize: '0.88rem' }}>
                <i data-lucide="file-text" style={{ width: 16, height: 16 }}></i>
                <span>Thi Thử Lý Thuyết</span>
              </button>

              <button onClick={toggleTheme} aria-label="Chuyển đổi giao diện" style={{ width: '42px', height: '42px', borderRadius: '50%', background: 'var(--bg-card)', border: '1px solid var(--border-color)', color: 'var(--text-main)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
                {theme === 'dark' ? <i data-lucide="sun" style={{ width: 20, height: 20, color: '#F59E0B' }}></i> : <i data-lucide="moon" style={{ width: 20, height: 20, color: '#3B82F6' }}></i>}
              </button>

              <button onClick={() => onOpenRegister()} className="btn btn-primary" style={{ padding: '0.65rem 1.4rem', fontSize: '0.9rem' }}>
                <span>Tư Vấn Ngay</span>
                <i data-lucide="chevron-right" style={{ width: 16, height: 16, stroke: '#051A10' }}></i>
              </button>
            </div>
          </div>
        </header>
      );
    }

    // --- Hero Section ---
    function Hero({ onOpenRegister, onOpenTestModal }) {
      return (
        <section style={{ position: 'relative', padding: '4.5rem 0 3.5rem 0', background: 'var(--gradient-hero)', overflow: 'hidden' }}>
          <div className="container" style={{ position: 'relative', zIndex: 1 }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1.15fr 0.85fr', gap: '3.5rem', alignItems: 'center' }}>
              <div>
                <div className="badge badge-emerald" style={{ marginBottom: '1.25rem' }}>
                  <i data-lucide="sparkles" style={{ width: 16, height: 16 }}></i>
                  <span>Tuyển sinh khóa mới 2026 • Tặng 1.000.000đ cho 50 người đăng ký đầu tiên</span>
                </div>
                <h1 style={{ fontSize: 'clamp(2.2rem, 4vw, 3.5rem)', letterSpacing: '-0.03em', marginBottom: '1.25rem', lineHeight: 1.15 }}>
                  Học Lái Xe Ô Tô & Xe Máy <span className="text-gradient">Cam Kết Đậu 99%</span>
                </h1>
                {/* Highlighted Banner Box */}
                <div style={{
                  background: 'linear-gradient(135deg, rgba(0, 229, 153, 0.12) 0%, rgba(59, 130, 246, 0.08) 100%)',
                  border: '1.5px solid var(--accent-emerald)',
                  boxShadow: '0 8px 30px rgba(0, 229, 153, 0.18)',
                  borderRadius: '1.25rem',
                  padding: '1.5rem',
                  marginBottom: '2rem',
                  backdropFilter: 'blur(10px)'
                }}>
                  <div style={{
                    fontSize: '1.25rem',
                    fontWeight: 800,
                    color: 'var(--text-main)',
                    marginBottom: '0.65rem',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '0.55rem',
                    fontFamily: "'Be Vietnam Pro', 'Montserrat', sans-serif",
                    letterSpacing: '0.01em'
                  }}>
                    <i data-lucide="shield-check" style={{ width: 24, height: 24, color: 'var(--accent-emerald)' }}></i>

    // Helper to make URLs clickable in legal text
    const renderLegalTextWithLinks = (text) => {
      if (typeof text !== 'string') return text;
      const urlRegex = /(https?:\/\/[^\s,)]+)/g;
      if (!urlRegex.test(text)) return text;
      const parts = text.split(urlRegex);
      return parts.map((part, idx) => {
        if (part.startsWith('http://') || part.startsWith('https://')) {
          const isFacebook = part.includes('facebook.com');
          return (
            <a
              key={idx}
              href={part}
              target="_blank"
              rel="noopener noreferrer"
              style={{
                color: isFacebook ? '#60A5FA' : '#93C5FD',
                textDecoration: 'underline',
                textUnderlineOffset: '3px',
                fontWeight: 600,
                wordBreak: 'break-all'
              }}
            >
              {part}
            </a>
          );
        }
        return part;
      });
    };

    function LegalModal({ docKey, onClose }) {
      if (!docKey) return null;
      const [activeId, setActiveId] = React.useState(docKey || 'privacy');
      React.useEffect(() => { if (docKey) setActiveId(docKey); }, [docKey]);

      const docInfo = {
        privacy: { title: 'Chính sách bảo mật', tab: 'CHÍNH SÁCH BẢO MẬT', mobileMain: 'Chính Sách', mobileSub: 'Bảo Mật', pdf: '/dieu-luat/chinh-sach-bao-mat.pdf' },
        terms: { title: 'Điều khoản sử dụng', tab: 'ĐIỀU KHOẢN SỬ DỤNG', mobileMain: 'Điều Khoản', mobileSub: 'Sử Dụng', pdf: '/dieu-luat/dieu-khoan-su-dung.pdf' },
        refund: { title: 'Chính sách đăng ký, hủy và hoàn tiền', tab: 'CHÍNH SÁCH ĐĂNG KÝ, HUỶ, HOÀN TIỀN', mobileMain: 'Đăng Ký, Huỷ', mobileSub: '& Hoàn Tiền', pdf: '/dieu-luat/chinh-sach-dang-ky-huy-hoan-tien.pdf' }
      };

      const curMeta = docInfo[activeId] || docInfo.privacy;
      const cur = LEGAL_DATA[activeId] || LEGAL_DATA.privacy;

      return (
        <div className="legal-modal-backdrop" style={{ position: 'fixed', inset: 0, zIndex: 999999, background: 'rgba(5,10,24,0.88)', backdropFilter: 'blur(16px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 'clamp(0.5rem, 2vw, 1.25rem)' }} onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="legal-modal-container" style={{ width: '100%', maxWidth: '1020px', height: '92vh', background: 'var(--bg-card, #0F172A)', border: '1.5px solid var(--border-color, #1E293B)', borderRadius: '20px', display: 'flex', flexDirection: 'column', overflow: 'hidden', boxShadow: '0 30px 80px rgba(0,0,0,0.75)' }}>
            <div className="legal-modal-header">
              <div className="legal-header-top-bar">
                <div className="legal-header-brand-badge">
                  <span>QUY CHẾ &amp; PHÁP LÝ</span>
                </div>
                <div className="legal-header-actions">
                  <a href={curMeta.pdf} download className="legal-header-btn" style={{ color: '#F59E0B', fontWeight: 700, fontSize: '0.8rem', padding: '0.45rem 0.8rem', background: '#0B0F19', border: '1px solid #1E293B', borderRadius: '9px', textDecoration: 'none' }}>Tải PDF</a>
                  <button onClick={onClose} className="legal-close-btn" style={{ width: '36px', height: '36px', borderRadius: '9px', background: '#0B0F19', border: '1px solid #1E293B', color: '#F1F5F9', cursor: 'pointer', fontWeight: 800, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>
                </div>
              </div>
              <div className="legal-tabs-list">
                {Object.entries(docInfo).map(([k, d]) => (
                  <button key={k} onClick={() => setActiveId(k)} className={`legal-tab-btn ${k === activeId ? 'active' : ''}`}>
                    <span className="tab-label-desktop">{d.tab}</span>
                    <span className="tab-label-mobile">
                      <span className="tab-mobile-main">{d.mobileMain}</span>
                      <span className="tab-mobile-sub">{d.mobileSub}</span>
                    </span>
                  </button>
                ))}
              </div>
            </div>
            <div style={{ flex: 1, overflowY: 'auto', background: '#0B0F19', padding: '2.5rem clamp(1rem, 4vw, 3.5rem) 4rem clamp(1rem, 4vw, 3.5rem)' }}>
              <div style={{ maxWidth: '840px', margin: '0 auto', color: '#CBD5E1' }}>
                <div style={{ display: 'inline-block', padding: '0.3rem 0.75rem', borderRadius: '8px', background: 'rgba(29,78,216,0.15)', border: '1px solid rgba(59,130,246,0.3)', color: '#60A5FA', fontSize: '0.78rem', fontWeight: 800, textTransform: 'uppercase', marginBottom: '0.85rem' }}>VĂN BẢN PHÁP LÝ CHÍNH THỨC</div>
                <h1 style={{ fontSize: 'clamp(1.75rem, 4vw, 2.35rem)', fontWeight: 900, color: '#FFFFFF', margin: '0 0 0.65rem 0', lineHeight: 1.25 }}>{cur.title || curMeta.title}</h1>
                <div style={{ fontSize: '0.88rem', color: '#94A3B8', marginBottom: '2rem' }}>{cur.date}</div>
                
                {cur.intro && (
                  <div style={{ paddingBottom: '1.5rem', marginBottom: '2rem', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
                    {cur.intro.map((p, i) => <p key={i} style={{ fontSize: '1.02rem', lineHeight: 1.75, color: '#E2E8F0', marginBottom: '1rem', textAlign: 'justify' }}>{renderLegalTextWithLinks(p.text)}</p>)}
                  </div>
                )}

                {cur.sections && cur.sections.map((sec) => (
                  <section key={sec.number} style={{ marginBottom: '2.5rem' }}>
                    <h2 style={{ fontSize: '1.28rem', fontWeight: 800, color: '#FFFFFF', marginTop: '1.5rem', marginBottom: '0.9rem', display: 'flex', gap: '0.4rem' }}>
                      <span style={{ color: '#60A5FA' }}>{sec.number}.</span>
                      <span>{sec.heading}</span>
                    </h2>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                      {sec.content.map((item, idx) => {
                        if (item.type === 'subheading') {
                          return (
                            <h3 key={idx} style={{ fontSize: '1.06rem', fontWeight: 700, color: '#93C5FD', marginTop: '1rem', marginBottom: '0.35rem', lineHeight: 1.45 }}>
                              {item.text}
                            </h3>
                          );
                        }
                        if (item.type === 'bullet') {
                          return (
                            <div key={idx} style={{ display: 'flex', alignItems: 'flex-start', gap: '0.65rem', paddingLeft: '0.35rem', lineHeight: 1.7, fontSize: '0.96rem', color: '#E2E8F0' }}>
                              <span style={{ color: '#60A5FA', fontSize: '1.1rem', lineHeight: '1.4rem' }}>•</span>
                              <span style={{ textAlign: 'justify' }}>{renderLegalTextWithLinks(item.text)}</span>
                            </div>
                          );
                        }
                        return <p key={idx} style={{ fontSize: '0.96rem', lineHeight: 1.75, color: '#CBD5E1', margin: 0, textAlign: 'justify' }}>{renderLegalTextWithLinks(item.text)}</p>;
                      })}
                    </div>
                  </section>
                ))}

                {cur.closing && (
                  <div style={{ marginTop: '2rem', marginBottom: '1rem', padding: '1.25rem 1.5rem', background: 'rgba(30, 41, 59, 0.5)', borderLeft: '4px solid #3B82F6', borderRadius: '0 12px 12px 0', color: '#E2E8F0', fontSize: '0.98rem', lineHeight: 1.7, fontStyle: 'italic' }}>
                    {cur.closing}
                  </div>
                )}

                <div style={{ marginTop: '2.5rem', padding: '1.5rem', background: 'rgba(30, 41, 59, 0.5)', border: '1px solid rgba(59, 130, 246, 0.25)', borderRadius: '14px', display: 'flex', flexDirection: 'column', gap: '0.85rem' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', color: '#60A5FA', fontWeight: 800, fontSize: '0.92rem' }}>
                    <span>✓ HIỆU LỰC &amp; THẨM QUYỀN BAN HÀNH</span>
                  </div>
                  <p style={{ margin: 0, fontSize: '0.88rem', color: '#94A3B8', lineHeight: 1.6 }}>
                    Văn bản này có giá trị áp dụng chính thức và có hiệu lực đối với tất cả học viên, khách hàng và cá nhân tham gia các khóa học tại hệ thống <strong>Thầy Hồng Dạy Lái</strong> (Hà Nội &amp; Bắc Ninh).
                  </p>
                  <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', gap: '0.85rem', paddingTop: '0.65rem', borderTop: '1px dashed rgba(255, 255, 255, 0.12)', fontSize: '0.88rem', color: '#E2E8F0' }}>
                    <div>
                      <span>Hotline/Zalo tư vấn &amp; giải đáp quy chế: <a href="tel:0336611194" style={{ color: '#FBBF24', fontWeight: 800, textDecoration: 'none' }}>0336.611.194</a></span>
                    </div>
                    <div>
                      <a href="https://www.facebook.com/share/1GuWF1te7x/" target="_blank" rel="noopener noreferrer" style={{ display: 'inline-flex', alignItems: 'center', gap: '0.45rem', padding: '0.35rem 0.85rem', borderRadius: '8px', background: 'rgba(24, 119, 242, 0.15)', border: '1px solid rgba(24, 119, 242, 0.35)', color: '#60A5FA', fontSize: '0.85rem', fontWeight: 700, textDecoration: 'none' }}>
                        <span>FANPAGE : Thầy Hồng Dạy Lái . ↗</span>
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Main App Component ---
    function App() {
      const [theme, setTheme] = useState('light');
      const [isRegisterOpen, setIsRegisterOpen] = useState(false);
      const [isTestOpen, setIsTestOpen] = useState(false);
      const [legalDoc, setLegalDoc] = useState(null);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [theme, isTestOpen, isRegisterOpen, legalDoc]);

      const toggleTheme = () => setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));

      return (
        <div className="app-root">
          <Navbar theme={theme} toggleTheme={toggleTheme} onOpenRegister={() => setIsRegisterOpen(true)} onOpenTestModal={() => setIsTestOpen(true)} />
          <main>
            <Hero onOpenRegister={() => setIsRegisterOpen(true)} onOpenTestModal={() => setIsTestOpen(true)} />
            <CoursePackages onOpenRegister={() => setIsRegisterOpen(true)} />
          </main>
          <Footer onOpenLegal={(docKey) => setLegalDoc(docKey)} />
          <RegisterModal isOpen={isRegisterOpen} onClose={() => setIsRegisterOpen(false)} />
          <TestModal isOpen={isTestOpen} onClose={() => setIsTestOpen(false)} />
          <LegalModal docKey={legalDoc} onClose={() => setLegalDoc(null)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
