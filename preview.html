  <style>
    /* ==========================================================================
       DESIGN SYSTEM & THEME TOKENS (LIGHT & DARK MODE)
       ========================================================================== */
    :root, [data-theme='dark'] {
      --bg-main: #0B0F19;
      --bg-card: #131B2E;
      --bg-card-hover: #1A243F;
      --bg-nav: rgba(11, 15, 25, 0.85);
      --bg-glass: rgba(19, 27, 46, 0.7);
      --bg-input: #19233C;

      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --text-light: #6B7280;

      --border-color: rgba(255, 255, 255, 0.1);
      --border-highlight: rgba(0, 229, 153, 0.3);

      --accent-emerald: #00E599;
      --accent-emerald-glow: rgba(0, 229, 153, 0.25);
      --accent-blue: #3B82F6;
      --accent-blue-glow: rgba(59, 130, 246, 0.25);
      --accent-orange: #F59E0B;
      --accent-red: #EF4444;

      --gradient-emerald: linear-gradient(135deg, #00E599 0%, #00B377 100%);
      --gradient-blue: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
      --gradient-orange: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);

      --gradient-hero: radial-gradient(circle at 50% 20%, rgba(0, 229, 153, 0.12) 0%, rgba(59, 130, 246, 0.08) 50%, rgba(11, 15, 25, 0) 100%);

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
      --shadow-neon: 0 0 25px rgba(0, 229, 153, 0.3);
    }

    [data-theme='light'] {
      --bg-main: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F1F5F9;
      --bg-nav: rgba(255, 255, 255, 0.9);
      --bg-glass: rgba(255, 255, 255, 0.8);
      --bg-input: #F1F5F9;

      --text-main: #0F172A;
      --text-muted: #475569;
      --text-light: #94A3B8;

      --border-color: #E2E8F0;
      --border-highlight: rgba(16, 185, 129, 0.4);

      --accent-emerald: #059669;
      --accent-emerald-glow: rgba(5, 150, 105, 0.15);
      --accent-blue: #2563EB;
      --accent-blue-glow: rgba(37, 99, 235, 0.15);
      --accent-orange: #D97706;
      --accent-red: #DC2626;

      --gradient-emerald: linear-gradient(135deg, #059669 0%, #047857 100%);
      --gradient-blue: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      --gradient-orange: linear-gradient(135deg, #D97706 0%, #B45309 100%);
      --gradient-dark-card: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
      --gradient-hero: radial-gradient(circle at 50% 20%, rgba(5, 150, 105, 0.08) 0%, rgba(37, 99, 235, 0.06) 50%, rgba(248, 250, 252, 0) 100%);

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 16px 40px rgba(15, 23, 42, 0.12);
      --shadow-neon: 0 0 25px rgba(5, 150, 105, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-family: 'Be Vietnam Pro', 'Inter', sans-serif; font-size: 16px; }
    body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; overflow-x: hidden; transition: background-color 0.3s ease, color 0.3s ease; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Be Vietnam Pro', 'Montserrat', sans-serif; font-weight: 700; line-height: 1.25; color: var(--text-main); }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font-family: inherit; }
    
    .container { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 1.5rem; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.85rem 1.75rem; border-radius: 9999px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid transparent; }
    .btn-primary { background: var(--gradient-emerald); color: #051A10; font-weight: 700; box-shadow: 0 4px 14px var(--accent-emerald-glow); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-emerald-glow); filter: brightness(1.08); }
    .btn-secondary { background: var(--bg-card); color: var(--text-main); border-color: var(--border-color); }
    .btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--accent-blue); color: var(--accent-blue); transform: translateY(-2px); }

    .badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.9rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; }
    .badge-emerald { background: var(--accent-emerald-glow); color: var(--accent-emerald); border: 1px solid rgba(0, 229, 153, 0.3); }
    .badge-blue { background: var(--accent-blue-glow); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-purple {
      background: rgba(168, 85, 247, 0.18);
      color: #A855F7;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }
    .badge-orange { background: rgba(245, 158, 11, 0.15); color: var(--accent-orange); border: 1px solid rgba(245, 158, 11, 0.3); }

    .text-gradient { background: linear-gradient(135deg, var(--accent-emerald) 0%, var(--accent-blue) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .glass-card { background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 1.25rem; transition: all 0.3s ease; }
    .glass-card:hover { border-color: var(--border-highlight); box-shadow: var(--shadow-md); }

    .section-title-wrapper { text-align: center; max-width: 700px; margin: 0 auto 3.5rem auto; }
    .section-title { font-size: 2.5rem; margin-top: 0.75rem; margin-bottom: 1rem; letter-spacing: -0.02em; }
    .section-subtitle { color: var(--text-muted); font-size: 1.1rem; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }

    /* Hide scrollbars */
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    input, select, textarea {
      font-size: 16px !important;

    }

    html, body {
      overflow-x: hidden;
      width: 100%;

    @media (max-width: 1024px) {
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .section-title { font-size: 2rem; }

    @media (max-width: 768px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .section-title { font-size: 1.65rem; }
      .container { padding: 0 1rem; }

    .nav-link-card:hover { border-color: var(--accent-emerald); background: var(--bg-card-hover); color: var(--accent-emerald); box-shadow: 0 4px 16px var(--accent-emerald-glow); transform: translateY(-2px); }

</head>

    function RegisterModal({ isOpen, onClose, initialData }) {

        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, zIndex: 200, background: 'rgba(0,0,0,0.75)', backdropFilter: 'blur(8px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1.5rem' }}>

    function App() {
      const [theme, setTheme] = useState('light');
      const [isRegisterOpen, setIsRegisterOpen] = useState(false);
      const [isTestOpen, setIsTestOpen] = useState(false);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [theme, isTestOpen, isRegisterOpen]);

      const toggleTheme = () => setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));

      return (
        <div className="app-root">
          <Navbar theme={theme} toggleTheme={toggleTheme} onOpenRegister={() => setIsRegisterOpen(true)} onOpenTestModal={() => setIsTestOpen(true)} />
          <main>
            <Hero onOpenRegister={() => setIsRegisterOpen(true)} onOpenTestModal={() => setIsTestOpen(true)} />

          <TestModal isOpen={isTestOpen} onClose={() => setIsTestOpen(false)} />
